version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: changia-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - changia-net

  backend:
    build:
      context: ./backend
    container_name: changia-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/changia
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      UPLOADS_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - changia-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: changia-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - changia-net

networks:
  changia-net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
